<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1627">
  <meta name="description" content="Кратерика — логистические головоломки и развитие лунной колонии.">
  <title>Кратерика — проект игры</title>
  <style>
    :root { font: 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; background:linear-gradient(165deg,#0b1627,#172840 65%,#122237); color:#eff7ff; }
    main { width:min(1100px,100%); margin:0 auto; padding:clamp(12px,2.5vw,28px); }
    .header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:18px; }
    .logo { font-size:clamp(23px,4vw,38px); font-weight:800; letter-spacing:.06em; margin:0; }
    .phase { font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:7px 10px; border:1px solid #5b7286; border-radius:20px; color:#b7cddd; }
    .frame { padding:10px; background:#233c59; border:1px solid #4d6987; border-radius:18px; box-shadow:0 18px 46px #0004; overflow:hidden; }
    #game { height:min(67dvh,650px); min-height:320px; width:100%; background:#0d2035; border-radius:12px; overflow:hidden; }
    .note { margin:16px 2px 0; color:#b2c9db; font-size:14px; }
    .note strong { color:#f1d19a; }
    @media(max-width:520px) { .header { align-items:flex-start; } .phase{font-size:10px;} #game{height:61dvh; min-height:300px;} }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <h1 class="logo">КРАТЕРИКА</h1><span class="phase">G1 · проектирование</span>
    </header>
    <div class="frame"><div id="game" aria-label="Статический предпросмотр лунной колонии — игровой процесс ещё не реализован"></div></div>
    <p id="status" class="note" role="status">
      <strong>Технический каркас, не играбельная версия.</strong>
      Следующий шаг: реализовать детерминированную логистическую симуляцию и две первые миссии.
    </p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
