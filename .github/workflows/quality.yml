name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Node 22 / G2-R yard and legacy regression build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check project and build
        run: npm run check
      - name: Verify generated manifest matches source
        run: cmp ludory.project.json dist/ludory.project.json
