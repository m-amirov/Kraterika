name: browser-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable:
    name: G2-R live yard Phaser browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked game dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exactly checked out game
        run: npm run build
      - name: Install browser test runner only in CI (not game dependency)
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run observed gameplay smoke
        run: node scripts/yard-browser-smoke.mjs
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2r-live-yard-screenshots
          path: test-results/
          if-no-files-found: ignore
